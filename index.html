<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HouseLabs.Live | Charleston's DJ Playground</title>

  <meta
    name="description"
    content="HouseLabs.Live is Charleston's DJ Playground — a community built around a shared love of House Music."
  >

  <meta name="theme-color" content="#050505">

  <!-- Open Graph -->
  <meta
    property="og:title"
    content="HouseLabs.Live | Charleston's DJ Playground"
  >

  <meta
    property="og:description"
    content="We Love House Music. Come play, learn, connect, experiment and create."
  >

  <meta property="og:type" content="website">

  <meta
    property="og:url"
    content="https://houselabs.live/"
  >


  <!-- =========================================
       FONTS
  ========================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >


  <!-- =========================================
       MAIN STYLESHEET
  ========================================== -->

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body>


  <!-- =========================================
       SUBTLE SITE TEXTURE
  ========================================== -->

  <div
    class="site-noise"
    aria-hidden="true"
  ></div>



  <!-- =========================================
       HEADER / NAVIGATION
  ========================================== -->

  <header class="site-header">


    <div class="header-inner">


      <!-- HOUSELABS LOGO -->

      <a
        href="#top"
        class="site-logo"
        aria-label="HouseLabs.Live Home"
      >

        <img
          src="assets/e93fd84bb1abbb0adcdcfe3ebb9fec11d88ddc28ab45b89df30d2e6be9d8fd0a.png"
          alt="HouseLabs.Live"
        >

      </a>



      <!-- DESKTOP NAVIGATION -->

      <nav
        class="desktop-nav"
        aria-label="Main Navigation"
      >

        <a href="#sessions">
          Sessions
        </a>

        <a href="#learn">
          Learn
        </a>

        <a href="#music">
          Music
        </a>

        <a href="#community">
          Community
        </a>

        <a href="#manifesto">
          Manifesto
        </a>

        <a
          href="#join"
          class="nav-button"
        >
          Come Play
        </a>

      </nav>



      <!-- MOBILE MENU BUTTON -->

      <button
        class="mobile-menu-button"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
      >

        <span></span>
        <span></span>

      </button>


    </div>



    <!-- MOBILE NAVIGATION -->

    <nav
      class="mobile-nav"
      aria-label="Mobile Navigation"
    >

      <a href="#sessions">
        Sessions
      </a>

      <a href="#learn">
        Learn
      </a>

      <a href="#music">
        Music
      </a>

      <a href="#community">
        Community
      </a>

      <a href="#manifesto">
        Manifesto
      </a>

      <a
        href="#join"
        class="mobile-nav-cta"
      >
        Come Play →
      </a>

    </nav>


  </header>



  <!-- =========================================
       MAIN WEBSITE
  ========================================== -->

  <main id="top">


    <!-- =========================================
         HERO
    ========================================== -->

    <section class="hero">


      <!-- REAL HOUSELABS FOUNDING ROUNDTABLE PHOTO -->

      <div
        class="hero-background hero-photo"
        aria-hidden="true"
      ></div>


      <!-- DARK CINEMATIC OVERLAY -->

      <div
        class="hero-overlay"
        aria-hidden="true"
      ></div>


      <!-- HOUSELABS GRADIENT GLOW -->

      <div
        class="hero-glow"
        aria-hidden="true"
      ></div>



      <!-- HERO CONTENT -->

      <div class="hero-content">


        <p class="hero-kicker">
          HOUSELABS.LIVE
        </p>


        <h1 class="hero-title">

          <span class="hero-title-white">
            CHARLESTON'S
          </span>

          <span class="hero-title-gradient">
            DJ PLAYGROUND.
          </span>

        </h1>



        <div class="hero-message">

          <h2>
            WE LOVE HOUSE MUSIC.
            <span class="heart">♥</span>
          </h2>

          <p>
            So we built a community around it.
          </p>

        </div>



        <div class="hero-actions">


          <a
            href="#join"
            class="hero-button hero-button-primary"
          >

            Come Play

            <span>
              ↗
            </span>

          </a>


          <a
            href="#about"
            class="hero-button hero-button-secondary"
          >

            Explore HouseLabs

          </a>


        </div>


      </div>



      <!-- BOTTOM HOUSELABS LANGUAGE -->

      <div class="hero-bottom">

        <span>
          PLAY
        </span>

        <span class="hero-dot"></span>

        <span>
          LEARN
        </span>

        <span class="hero-dot"></span>

        <span>
          CONNECT
        </span>

        <span class="hero-dot"></span>

        <span>
          CREATE
        </span>

      </div>



      <!-- SCROLL INDICATOR -->

      <a
        href="#about"
        class="hero-scroll"
        aria-label="Explore HouseLabs"
      >

        <span>
          DISCOVER
        </span>

        <div class="hero-scroll-line"></div>

      </a>


    </section>



    <!-- =========================================
         SECTION 3 WILL GO HERE
         IT'S A LABORATORY.
         IT'S A PLAYGROUND.
    ========================================== -->


  </main>



  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script src="script.js"></script>


</body>

</html>
