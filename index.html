<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HouseLabs.Live | Charleston's DJ Playground</title>

  <meta
    name="description"
    content="HouseLabs.Live is Charleston's DJ Playground — a community built around a shared love of House Music."
  >

  <meta name="theme-color" content="#050505">

  <!-- Open Graph -->
  <meta property="og:title" content="HouseLabs.Live | Charleston's DJ Playground">
  <meta
    property="og:description"
    content="We Love House Music. Come play, learn, connect, experiment and create."
  >
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://houselabs.live/">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>


<body>

  <!-- Subtle site texture -->
  <div class="site-noise" aria-hidden="true"></div>


  <!-- =========================================
       HEADER / NAVIGATION
  ========================================== -->

  <header class="site-header">

    <div class="header-inner">

      <!-- HOUSELABS LOGO -->
      <a
        href="#top"
        class="site-logo"
        aria-label="HouseLabs.Live Home"
      >
        <img
          src="assets/houselabs-logo.png"
          alt="HouseLabs.Live"
        >
      </a>


      <!-- DESKTOP NAVIGATION -->
      <nav class="desktop-nav" aria-label="Main Navigation">

        <a href="#sessions">
          Sessions
        </a>

        <a href="#learn">
          Learn
        </a>

        <a href="#music">
          Music
        </a>

        <a href="#community">
          Community
        </a>

        <a href="#manifesto">
          Manifesto
        </a>

        <a href="#join" class="nav-button">
          Come Play
        </a>

      </nav>


      <!-- MOBILE MENU BUTTON -->
      <button
        class="mobile-menu-button"
        type="button"
        aria-label="Open navigation"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
      </button>

    </div>


    <!-- MOBILE NAVIGATION -->
    <nav class="mobile-nav" aria-label="Mobile Navigation">

      <a href="#sessions">
        Sessions
      </a>

      <a href="#learn">
        Learn
      </a>

      <a href="#music">
        Music
      </a>

      <a href="#community">
        Community
      </a>

      <a href="#manifesto">
        Manifesto
      </a>

      <a href="#join" class="mobile-nav-cta">
        Come Play →
      </a>

    </nav>

  </header>


  <!-- =========================================
       MAIN SITE
  ========================================== -->

  <main id="top">

    <!--
      SECTION 2:
      HERO GOES HERE
    -->

  </main>


  <!-- Main JavaScript -->
  <script src="script.js"></script>

</body>

</html>
